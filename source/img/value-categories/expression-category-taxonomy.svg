<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
  <style>.canvas{fill:#ffffff}@media (prefers-color-scheme: dark){.canvas{fill:#0f172a}}</style>
  <rect class="canvas" width="100%" height="100%"/>
  <style>
    .container     { fill:none; stroke:#334155; stroke-width:1.2; stroke-dasharray:5 4; }
    .container-lbl { font-weight:600; fill:#1f2937; font-size:14px; }
    .ellipse-g     { fill:#2b6cb0; fill-opacity:0.10; stroke:#2b6cb0; stroke-width:1.6; }
    .ellipse-r     { fill:#e11d48; fill-opacity:0.10; stroke:#e11d48; stroke-width:1.6; }
    .set-lbl-g     { font-weight:700; fill:#2b6cb0; font-size:15px; }
    .set-lbl-r     { font-weight:700; fill:#e11d48; font-size:15px; }
    .prop          { fill:#64748b; font-size:11px; font-style:italic; }
    .leaf          { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
                     font-weight:600; fill:#1f2937; font-size:16px; }
    .both          { fill:#64748b; font-size:11px; font-style:italic; }

    @media (prefers-color-scheme: dark) {
      .container     { stroke:#94a3b8; }
      .container-lbl { fill:#f1f5f9; }
      .ellipse-g     { fill:#60a5fa; fill-opacity:0.18; stroke:#60a5fa; }
      .ellipse-r     { fill:#f472b6; fill-opacity:0.18; stroke:#f472b6; }
      .set-lbl-g     { fill:#60a5fa; }
      .set-lbl-r     { fill:#f472b6; }
      .prop          { fill:#94a3b8; }
      .leaf          { fill:#f1f5f9; }
      .both          { fill:#94a3b8; }
    }
  </style>

  <!-- universal set: expression -->
  <rect class="container" x="20" y="30" width="600" height="300" rx="10"/>
  <text class="container-lbl" x="40" y="55">expression</text>

  <!-- glvalue ellipse (left) -->
  <ellipse class="ellipse-g" cx="240" cy="215" rx="180" ry="92"/>
  <!-- rvalue ellipse (right) -->
  <ellipse class="ellipse-r" cx="400" cy="215" rx="180" ry="92"/>

  <!-- set names + property hints, anchored in the non-intersection zones -->
  <text class="set-lbl-g" x="145" y="158" text-anchor="middle">glvalue</text>
  <text class="prop"      x="145" y="176" text-anchor="middle">has identity</text>

  <text class="set-lbl-r" x="495" y="158" text-anchor="middle">rvalue</text>
  <text class="prop"      x="495" y="176" text-anchor="middle">can be moved from</text>

  <!-- the three leaf categories -->
  <text class="leaf" x="145" y="230" text-anchor="middle">lvalue</text>
  <text class="leaf" x="320" y="230" text-anchor="middle">xvalue</text>
  <text class="leaf" x="495" y="230" text-anchor="middle">prvalue</text>

  <!-- subtle annotations under each leaf -->
  <text class="prop"  x="145" y="252" text-anchor="middle">glvalue only</text>
  <text class="both"  x="320" y="252" text-anchor="middle">glvalue ∩ rvalue</text>
  <text class="prop"  x="495" y="252" text-anchor="middle">rvalue only</text>
</svg>
