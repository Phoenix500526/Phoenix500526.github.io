    <text class="txt" x="20" y="78">Threads: <tspan class="num">5</tspan> total, <tspan class="num">0</tspan> running, <tspan class="num">5</tspan> sleeping</text>
    <text class="txt" x="20" y="98">%Cpu(s):  2.0 us,  0.5 sy,  0.0 ni, 97.4 id,  0.1 wa</text>
    <text class="txt" x="20" y="118">KiB Mem : 16384288 total, 10243012 free,  2148000 used</text>

    <text class="hdr"  x="20"  y="158">  PID   USER     PR  NI    VIRT    RES  S  %CPU  %MEM  COMMAND</text>

    <text class="num"  x="20"  y="180">14852</text>
    <text class="txt"  x="80"  y="180">phoenix  20   0   76420   3940  S   0.3   0.1</text>
    <text class="name" x="535" y="180">Thread_test</text>

