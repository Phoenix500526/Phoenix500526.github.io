<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">
  <defs>
    <clipPath id="term"><rect x="0" y="0" width="720" height="300" rx="8"/></clipPath>
    <style>
      .bg     { fill:#1e1e1e; }
      .head   { fill:#2d2d2d; }
      .title  { fill:#9aa0a6; font-size:12px; font-family:-apple-system, BlinkMacSystemFont, sans-serif; }
      .dot-r  { fill:#ff5f56; }
      .dot-y  { fill:#ffbd2e; }
      .dot-g  { fill:#27c93f; }
      .txt    { fill:#d4d4d4; }
      .hdr    { fill:#9cdcfe; font-weight:600; }
      .num    { fill:#b5cea8; }
      .name   { fill:#dcdcaa; font-weight:600; }
      .dim    { fill:#808080; }
    </style>
  </defs>
  <g clip-path="url(#term)">
    <rect class="bg"   x="0" y="0" width="720" height="300"/>
    <rect class="head" x="0" y="0" width="720" height="28"/>
    <circle class="dot-r" cx="14" cy="14" r="5.5"/>
    <circle class="dot-y" cx="32" cy="14" r="5.5"/>
    <circle class="dot-g" cx="50" cy="14" r="5.5"/>
    <text class="title" x="360" y="18" text-anchor="middle">$ top -H -p $(pgrep Thread_test)</text>

